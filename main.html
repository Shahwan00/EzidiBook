<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<title>الشريط السفلي</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background: #f2f2f2;
}


/* الشريط السفلي */
.bottom-bar {

    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);

    width: 85%;
    height: 60px;

    background: rgba(80, 170, 255, 0.55);

    border-radius: 30px;

    display: flex;
    flex-direction: row;

    justify-content: space-around;
    align-items: center;

    backdrop-filter: blur(10px);

}


/* الأزرار */
.bottom-bar button {

    background: transparent;
    border: none;

    font-size: 25px;

    cursor: pointer;

}


</style>

</head>


<body>


<!-- الشريط السفلي -->

<div class="bottom-bar">

<button>💬</button>

<button>🎬</button>

<button>🔍</button>

<button>🎮</button>


<button class="settings-button" onclick="location.href='settings.html'">


📚
</button>

</body>

<button onclick="location.href='posts.html'"
style="
position:fixed;
left:10px;
bottom:10px;
width:55px;
height:55px;
border:none;
border-radius:50%;
background:#16a34a;
color:white;
font-size:28px;
z-index:9999;
cursor:pointer;
">💚</button>

<button onclick="location.href='profile.html'"
style="
position:fixed;
right:10px;
bottom:10px;
width:55px;
height:55px;
border:none;
border-radius:50%;
background:#16a34a;
color:white;
font-size:28px;
z-index:9999;
cursor:pointer;
">🤝</button>
</body>
</html>
<script>
let post = JSON.parse(localStorage.getItem("lastPost"));

if (post) {
    document.body.innerHTML += `
        <div style="background:white;padding:15px;margin:15px;border-radius:15px;">
            <p>${post.text}</p>
            ${post.image && post.image !== window.location.href ? `<img src="${post.image}" style="width:100%;border-radius:10px;">` : ""}
        </div>
    `;
}
</script>
