<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء منشور</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:#f5f7fa;
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

h2{
text-align:center;
color:#00a651;
margin-bottom:20px;
}

textarea{
width:100%;
height:180px;
padding:15px;
border:2px solid #ddd;
border-radius:15px;
font-size:18px;
resize:none;
outline:none;
}

textarea:focus{
border-color:#00a651;
}

.image-box{
margin-top:20px;
text-align:center;
}

.image-box label{
display:inline-block;
padding:14px 30px;
background:#00a651;
color:#fff;
border-radius:12px;
cursor:pointer;
font-size:18px;
}

.image-box input{
display:none;
}

#preview{
margin-top:20px;
max-width:100%;
display:none;
border-radius:18px;
box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.publish{
margin-top:25px;
width:100%;
padding:16px;
font-size:20px;
border:none;
border-radius:15px;
background:#00a651;
color:#fff;
cursor:pointer;
}

.publish:hover{
background:#008c45;
}

</style>

</head>

<body>

<div class="container">

<h2>✍️ إنشاء منشور جديد</h2>

<textarea placeholder="بماذا تفكر؟"></textarea>

<div class="image-box">

<label for="photo">
📷 اختيار صورة
</label>

<input type="file" id="photo" accept="image/*">

<img id="preview">

</div>

<button type="button" class="publish" onclick="publishPost()">
    نشر
</button>

</div>

<script>

photo.onchange=function(){

let file=this.files[0];

if(file){

preview.src=URL.createObjectURL(file);

preview.style.display="block";

}

}

</script>

</body>

<script>

function replaceHolyNames(text){

text = text.replace(/خودي/gi,"𒀭 خودي");
text = text.replace(/خودى/gi,"𒀭 خودى");
text = text.replace(/طاووس ملك/gi,"𒀭 طاووس ملك");
text = text.replace(/تاوسي ملك/gi,"𒀭 تاوسي ملك");
text = text.replace(/شيخادي/gi,"𒀭 شيخادي");
text = text.replace(/لالش/gi,"𒀭 لالش");

return text;

}

</script>
<script>
function publishPost() {
    let text = document.getElementById("postText").value;
    let photo = document.getElementById("photo");

    text = replaceHolyNames(text);

    let post = {
        text: text,
        image: "",
        time: new Date().toLocaleString()
    };

    if (photo.files[0]) {
        let reader = new FileReader();

        reader.onload = function() {
            post.image = reader.result;
            savePost(post);
        };

        reader.readAsDataURL(photo.files[0]);
    } else {
        savePost(post);
    }
}

function savePost(post) {
    let posts = JSON.parse(localStorage.getItem("posts") || "[]");

    posts.unshift(post);

    localStorage.setItem("posts", JSON.stringify(posts));

    window.location.href = "home.html";
}
</script>
