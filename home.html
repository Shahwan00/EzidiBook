<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMD | الرئيسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <span>🌿 DTMD</span>
        <span>🔔</span>
    </div>

    <div class="main-content">

        <!-- صندوق إنشاء منشور جديد -->
        <div class="create-post-card">
            <textarea id="postInput" placeholder="بماذا تفكر اليوم؟"></textarea>
            
            <div class="preview-area">
                <img id="imagePreview" style="display:none; width:100%; border-radius:10px; margin-top:10px;">
                <video id="videoPreview" controls style="display:none; width:100%; border-radius:10px; margin-top:10px;"></video>
            </div>

            <div class="create-post-actions">
                <label for="postImage" class="upload-btn">📷 صورة</label>
                <input type="file" id="postImage" accept="image/*" style="display:none;">

                <label for="postVideo" class="upload-btn">🎥 فيديو</label>
                <input type="file" id="postVideo" accept="video/*" style="display:none;">

                <button class="publish-btn" onclick="addNewPost()">نشر</button>
            </div>
        </div>

        <!-- حاوية المنشورات -->
        <div id="feedContainer">
            <!-- كارت منشور تجريبي -->
            <div class="post-card">
                <div class="post-header">
                    <div class="post-avatar">
                        <img src="https://via.placeholder.com/40" alt="Avatar">
                    </div>
                    <div class="post-user-info">
                        <span class="post-author-name">اسم المستخدم</span>
                        <span class="post-time">منذ 5 دقائق</span>
                    </div>
                </div>

                <div class="post-text">
                    مرحباً بالجميع! هذا منشور يحتوي على نص وصورة وفيديو تجريبي.
                </div>

                <div class="post-media">
                    <img src="https://via.placeholder.com/500x300" alt="صورة المنشور">
                </div>

                <div class="post-actions">
                    <button class="action-btn">❤️ <span>إعجاب</span></button>
                    <button class="action-btn">💬 <span>تعليق</span></button>
                    <button class="action-btn">🎙️ <span>صوتي</span></button>
                    <button class="action-btn">🔄 <span>مشاركة</span></button>
                    <button class="action-btn">✈️ <span>إرسال</span></button>
                </div>
            </div>
        </div>

    </div>

    <!-- الشريط السفلي الثابت -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">🏠</a>
        <a href="#" class="nav-item">🎬</a>
        <a href="#" class="nav-item">🔍</a>
        <a href="#" class="nav-item">🎮</a>
        <a href="profile.html" class="nav-item">👤</a>
    </nav>

    <script src="home.js"></script>
</body>
</html>
