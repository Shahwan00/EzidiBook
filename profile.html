<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Tahoma, sans-serif;
}

body {
    background: #f5f7fa;
    padding-bottom: 80px;
}

/* الهيدر والغلاف */
.header-bg {
    height: 180px;
    background: linear-gradient(135deg, #00c6ff, #0072ff);
}

/* صورة البروفايل */
.profile-avatar-container {
    text-align: center;
    margin-top: -60px;
}

.profile-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: 4px solid #fff;
    object-fit: cover;
    background: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
}

.user-name {
    text-align: center;
    margin-top: 10px;
    font-size: 22px;
    color: #222;
}

.user-handle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 20px;
}

/* كارت المعلومات */
.info-card {
    width: 90%;
    max-width: 600px;
    margin: auto;
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    overflow: hidden;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 15px 20px;
    border-bottom: 1px solid #eee;
    font-size: 16px;
}

.item:last-child {
    border-bottom: none;
}

.item span {
    color: #555;
}

.item b {
    color: #00a651;
}

/* المنشورات */
.posts-title {
    text-align: center;
    margin: 30px 0 15px;
    font-size: 20px;
    color: #333;
}

.posts-container {
    width: 90%;
    max-width: 600px;
    margin: auto;
}

.post-card {
    background: #ffffff;
    border-radius: 18px;
    overflow: hidden;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,.08);
}

.post-image {
    width: 100%;
    display: block;
}

.post-text {
    padding: 15px;
    font-size: 17px;
    line-height: 1.6;
    color: #222;
}

.post-date {
    padding: 0 15px 15px;
    font-size: 13px;
    color: #888;
}
</style>
</head>

<body>

<div class="header-bg"></div>

<!-- تم إزالة عنصر الكاميرا 📷 نهائياً من هنا -->
<div class="profile-avatar-container">
    <img id="profileImage" class="profile-avatar" src="https://via.placeholder.com/120" alt="Profile">
</div>

<h2 class="user-name" id="fullname">الاسم الثلاثي</h2>
<div class="user-handle" id="username">@username</div>

<div class="info-card">
    <div class="item"><span>🎂 تاريخ الميلاد</span><b id="birth">--</b></div>
    <div class="item"><span>💍 الحالة الاجتماعية</span><b id="social">--</b></div>
    <div class="item"><span>👫 الجنس</span><b id="gender">--</b></div>
    <div class="item"><span>🍀 الطبقة الاجتماعية</span><b id="ezidi">--</b></div>
    <div class="item"><span>🌍 الدولة</span><b id="country">--</b></div>
    <div class="item"><span>📍 المنطقة</span><b id="region">--</b></div>
    <div class="item"><span>💼 المهنة</span><b id="job">--</b></div>
    <div class="item"><span>🗣️ اللغة</span><b id="language">--</b></div>
    <div class="item"><span>📊 مستوى اللغة</span><b id="level">--</b></div>
</div>

<h3 class="posts-title">منشوراتي</h3>

<div id="postsContainer" class="posts-container"></div>

<script>
// 1. عرض بيانات البروفايل والصورة الشخصية المحفوظة
document.getElementById("fullname").innerText = localStorage.getItem("fullname") || "الاسم الثلاثي";
document.getElementById("birth").innerText = localStorage.getItem("birth") || "--";
document.getElementById("gender").innerText = localStorage.getItem("gender") || "--";
document.getElementById("social").innerText = localStorage.getItem("social") || "--";
document.getElementById("ezidi").innerText = localStorage.getItem("ezidiClass") || "--";
document.getElementById("country").innerText = localStorage.getItem("country") || "--";
document.getElementById("region").innerText = localStorage.getItem("region") || "--";
document.getElementById("job").innerText = localStorage.getItem("job") || "--";
document.getElementById("language").innerText = localStorage.getItem("language") || "--";
document.getElementById("level").innerText = localStorage.getItem("level") || "--";

let userAvatar = localStorage.getItem("userAvatar");
if (userAvatar) {
    document.getElementById("profileImage").src = userAvatar;
}

// 2. تصحيح كود قراءة وعرض المنشورات (تصحيح أخطاء الـ Template Literals)
const postsContainer = document.getElementById("postsContainer");
const posts = JSON.parse(localStorage.getItem("posts")) || [];

if (posts.length > 0) {
    postsContainer.innerHTML = "";
    posts.forEach(post => {
        let card = document.createElement("div");
        card.className = "post-card";

        let imageHTML = post.image ? `<img src="${post.image}" class="post-image">` : "";
        let textHTML = post.text ? `<div class="post-text">${post.text}</div>` : "";
        let dateHTML = `<div class="post-date">${post.time || ""}</div>`;

        card.innerHTML = imageHTML + textHTML + dateHTML;
        postsContainer.appendChild(card);
    });
} else {
    postsContainer.innerHTML = "<p style='text-align:center; color:#888;'>لا توجد منشورات بعد</p>";
}
</script>

</body>
</html>
