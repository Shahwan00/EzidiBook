<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMD | Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-bg"></div>

    <div class="profile-card">
        <div class="avatar-container">
            <img id="profileImg" src="https://via.placeholder.com/90" alt="Profile">
        </div>

        <div class="user-name" id="fullname">الاسم الثلاثي</div>
        <div class="username-tag" id="username">@username</div>

        <div class="info-list">
            <div class="info-item"><span class="value" id="birth">--</span><span class="label">تاريخ الميلاد 🎂</span></div>
            <div class="info-item"><span class="value" id="zodiac">--</span><span class="label">البرج ♈</span></div>
            <div class="info-item"><span class="value" id="gender">--</span><span class="label">الجنس 👫</span></div>
            <div class="info-item"><span class="value" id="social">--</span><span class="label">الحالة الاجتماعية 💍</span></div>
            <div class="info-item"><span class="value" id="ezidiClass">--</span><span class="label">الطبقة الإيزيدية ☘️</span></div>
            <div class="info-item"><span class="value" id="country">--</span><span class="label">الدولة 🌍</span></div>
            <div class="info-item"><span class="value" id="region">--</span><span class="label">المنطقة 📍</span></div>
            <div class="info-item"><span class="value" id="job">--</span><span class="label">المهنة 💼</span></div>
            <div class="info-item"><span class="value" id="language">--</span><span class="label">اللغة 🗣️</span></div>
        </div>
    </div>

    <div class="posts-box">
        لا توجد منشورات حتى الآن
    </div>

    <!-- الشريط السفلي الثابت -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">🏠</a>
        <a href="#" class="nav-item">🎬</a>
        <a href="#" class="nav-item">🔍</a>
        <a href="#" class="nav-item">🎮</a>
        <a href="profile.html" class="nav-item active">👤</a>
    </nav>

    <script src="render.js"></script>

</body>
</html>
