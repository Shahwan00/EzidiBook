</head>

<script>
photo.onchange=function(){

if(file){
preview.src=URL.createObjectURL(file);
preview.style.display="block";
plus.style.display="none";
}
}
</script>

<script>
birth.onchange=function(){

let d=new Date(this.value);

let day=d.getDate();

let month=d.getMonth()+1;

let zodiac="";

if((month==3&&day>=21)||(month==4&&day<=19)) zodiac="الحمل";
else if((month==4&&day>=20)||(month==5&&day<=20)) zodiac="الثور";
else if((month==5&&day>=21)||(month==6&&day<=20)) zodiac="الجوزاء";
else if((month==6&&day>=21)||(month==7&&day<=22)) zodiac="السرطان";
else if((month==7&&day>=23)||(month==8&&day<=22)) zodiac="الأسد";
else if((month==8&&day>=23)||(month==9&&day<=22)) zodiac="العذراء";
else if((month==9&&day>=23)||(month==10&&day<=22)) zodiac="الميزان";
else if((month==10&&day>=23)||(month==11&&day<=21)) zodiac="العقرب";
else if((month==11&&day>=22)||(month==12&&day<=21)) zodiac="القوس";
else if((month==12&&day>=22)||(month==1&&day<=19)) zodiac="الجدي";
else if((month==1&&day>=20)||(month==2&&day<=18)) zodiac="الدلو";
else zodiac="الحوت";

document.getElementById("zodiac").value=zodiac;

}
</script>

<button id="register">إنشاء الحساب</button>
<script>

document.getElementById("register").onclick = function () {

let photo = document.getElementById("photo").files.length;

let name = document.querySelector('input[type="text"]').value.trim();

let email = document.querySelector('input[type="email"]').value.trim();

let pass = document.querySelectorAll('input[type="password"]')[0].value;

let pass2 = document.querySelectorAll('input[type="password"]')[1].value;

if(photo==0){
alert("الرجاء اختيار صورة شخصية");
return;
}

if(name==""){
alert("الرجاء إدخال الاسم الثلاثي");
return;
}

if(email==""){
alert("الرجاء إدخال البريد الإلكتروني");
return;
}

if(pass==""){
alert("الرجاء إدخال كلمة المرور");
return;
}

if(pass2==""){
alert("الرجاء تأكيد كلمة المرور");
return;
}

if(pass!=pass2){
alert("كلمتا المرور غير متطابقتين");
return;
}

let birth = document.getElementById("birth").value;

if(birth==""){
    alert("الرجاء اختيار تاريخ الميلاد");
    return;
}

let social = document.querySelectorAll("select")[0].value;

if(social=="اختر الحالة الاجتماعية"){
    alert("الرجاء اختيار الحالة الاجتماعية");
    return;
}

let gender = document.querySelectorAll("select")[1].value;

if(gender=="اختر الجنس"){
    alert("الرجاء اختيار الجنس");
    return;
}

let ezidiClass = document.querySelectorAll("select")[2].value;

if(ezidiClass=="هل حضرتك من أي طبقة اجتماعية إيزيدية؟"){
    alert("الرجاء اختيار الطبقة الاجتماعية الإيزيدية");
    return;
}

let country = document.getElementById("country").value;

if(country=="اختر الدولة"){
    alert("الرجاء اختيار الدولة");
    return;
}

let region = document.getElementById("region").value.trim();

if(region==""){
    alert("الرجاء إدخال المنطقة");
    return;
}

let job = document.getElementById("job").value.trim();

if(job==""){
    alert("الرجاء إدخال المهنة");
    return;
}

let language = document.getElementById("language").value;

if(language=="" || language=="اختر لغة"){
    alert("الرجاء اختيار لغة");
    return;
}

let level = document.getElementById("level").value;

if(level=="مستوى اللغة"){
    alert("الرجاء اختيار مستوى اللغة");
    return;
}

window.location.href = "home.html";

}

</script>
