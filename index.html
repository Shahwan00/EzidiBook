<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMD🌿 | إنشاء حساب</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="logo">DTMD🌿</div>

        <label class="image-box" for="photo">
            <img id="preview" alt="معاينة الصورة">
            <span id="plus">+</span>
        </label>

        <input type="file" id="photo" accept="image/*" hidden>

        <input type="text" id="fullnameInput" placeholder="الاسم الثلاثي">

        <input type="email" placeholder="البريد الإلكتروني">

        <input type="password" placeholder="كلمة المرور">

        <input type="password" placeholder="تأكيد كلمة المرور">

        <label for="birth">تاريخ الميلاد</label>
        <input type="date" id="birth">

        <input type="text" id="zodiac" placeholder="البرج" readonly>

        <select id="social">
            <option selected disabled>اختر الحالة الاجتماعية</option>
            <option>أعزب</option>
            <option>متزوج</option>
        </select>

        <select id="gender">
            <option selected disabled>⚥ اختر الجنس</option>
            <option>ذكر ♂</option>
            <option>أنثى ♀</option>
        </select>

        <select id="ezidiClass">
            <option selected disabled>هل حضرتك من أي طبقة اجتماعية إيزيدية؟</option>
            <option>مريد</option>
            <option>شيخ</option>
            <option>بير</option>
        </select>

        <select id="country">
            <option selected disabled>اختر الدولة</option>
            <option>ألمانيا</option>
            <option>العراق</option>
            <option>سوريا</option>
            <option>تركيا</option>
            <option>إسبانيا</option>
            <option>فرنسا</option>
            <option>هولندا</option>
            <option>بلجيكا</option>
            <option>السويد</option>
            <option>النمسا</option>
            <option>سويسرا</option>
            <option>الدنمارك</option>
            <option>النرويج</option>
            <option>فنلندا</option>
            <option>بريطانيا</option>
            <option>أمريكا</option>
            <option>كندا</option>
            <option>أستراليا</option>
        </select>

        <input type="text" id="region" placeholder="المنطقة / المدينة">

        <input type="text" id="job" placeholder="المهنة">

        <label>اللغة الأم</label>
        <input type="text" value="𐺩𐺏𐺨𐺋𐺨" readonly>

        <label>اللغات التي تتحدث بها (يمكنك اختيار أكثر من لغة):</label>

        <div class="checkbox-group" id="languages">
            <label><input type="checkbox" name="lang" value="العربية"> العربية</label>
            <label><input type="checkbox" name="lang" value="Hindi"> Hindi</label>
            <label><input type="checkbox" name="lang" value="Deutsch"> Deutsch</label>
            <label><input type="checkbox" name="lang" value="English"> English</label>
            <label><input type="checkbox" name="lang" value="Español"> Español</label>
            <label><input type="checkbox" name="lang" value="Français"> Français</label>
            <label><input type="checkbox" name="lang" value="Türkçe"> Türkçe</label>
            <label><input type="checkbox" name="lang" value="Русский"> Русский</label>
            <label><input type="checkbox" name="lang" value="Italiano"> Italiano</label>
            <label><input type="checkbox" name="lang" value="Português"> Português</label>
            <label><input type="checkbox" name="lang" value="Nederlands"> Nederlands</label>
            <label><input type="checkbox" name="lang" value="Svenska"> Svenska</label>
        </div>

        <select id="level">
            <option selected disabled>مستوى اللغة</option>
            <option>مبتدئ</option>
            <option>متوسط</option>
            <option>جيد جداً</option>
            <option>ممتاز</option>
        </select>

        <button id="register">إنشاء الحساب</button>

    </div>

    <script src="input.js"></script>

</body>
</html>
