<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DTMD | الرئيسية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- الشريط العلوي -->
    <div class="top-bar">
        <span>🌿 DTMD</span>
        <span>🔔</span>
    </div>

    <div class="main-content">
        <!-- كارت منشور محتوي على نص وصورة وفيديو -->
        <div class="post-card">
            <div class="post-header">
                <div class="post-avatar">
                    <img src="https://via.placeholder.com/40" alt="صورة المستخدم">
                </div>
                <div class="post-user-info">
                    <span class="post-author-name">اسم المستخدم</span>
                    <span class="post-time">منذ 10 دقائق</span>
                </div>
            </div>

            <!-- نص المنشور -->
            <div class="post-text">
                مرحباً بالجميع! هذا منشور تجريبي يحتوي على نص، صورة، ومقطع فيديو.
            </div>

            <!-- صورة المنشور -->
            <div class="post-media">
                <img src="https://via.placeholder.com/500x300" alt="صورة المنشور">
            </div>

            <!-- فيديو المنشور -->
            <div class="post-media">
                <video controls>
                    <source src="sample.mp4" type="video/mp4">
                    متصفحك لا يدعم تشغيل الفيديو.
                </video>
            </div>

            <!-- شريط التفاعلات أسفل المنشور -->
            <div class="post-actions">
                <button class="action-btn">❤️ <span>إعجاب</span></button>
                <button class="action-btn">💬 <span>تعليق</span></button>
                <button class="action-btn">🎙️ <span>تعليق صوتي</span></button>
                <button class="action-btn">🔄 <span>مشاركة</span></button>
                <button class="action-btn">✈️ <span>إرسال</span></button>
            </div>
        </div>
    </div>

    <!-- الشريط السفلي الثابت -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item active">🏠</a>
        <a href="#" class="nav-item">🎬</a>
        <a href="#" class="nav-item">🔍</a>
        <a href="#" class="nav-item">🎮</a>
        <a href="profile.html" class="nav-item">👤</a>
    </nav>

</body>
</html>
